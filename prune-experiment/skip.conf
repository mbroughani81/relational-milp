# skip.conf — configs the pruning experiment should always ignore.
#
# One glob pattern per line, matched against each config's tag:
#
#     <method>__<arch>__<mode>__p<rate>
#
# where
#   method = milp_abcrown | abcrown | reludiff | neurodiff
#   arch   = mnist_relu_3_100 | mnist_relu_2_512 | mnist_relu_4_1024
#   mode   = global | three_pixel
#   rate   = pruning percent (5, 10, 20, 30, 40, 50)
#
# Shell globbing (*, ?, [..]) is supported. Blank lines and lines starting with
# '#' are ignored. A config whose tag matches ANY pattern is skipped and
# reported as "skipconf" in the summary. This applies to every run (it is the
# persistent counterpart to the one-off EXP_EXCLUDE variable).
#
# Examples:
#   reludiff__mnist_relu_3_100__global__p20     # one config (e.g. it always times out)
#   reludiff__*__*__p50                         # all ReluDiff runs at 50% pruning
#   *__mnist_relu_4_1024__*__*                  # everything on the 1024-wide net

# --- MILP + abcrown: skip the global regions on the two larger nets ---
milp_abcrown__mnist_relu_2_512__global__*
abcrown__mnist_relu_2_512__global__*
milp_abcrown__mnist_relu_4_1024__global__*
abcrown__mnist_relu_4_1024__global__*

# TODO: delete this
milp_abcrown__mnist_relu_4_1024__three_pixel__p30
milp_abcrown__mnist_relu_4_1024__three_pixel__p40
milp_abcrown__mnist_relu_4_1024__three_pixel__p50

abcrown__*

# --- ReluDiff: skip 30% pruning and higher, global only (three_pixel still runs) ---
reludiff__*__global__p30
reludiff__*__global__p40
reludiff__*__global__p50

reludiff__mnist_relu_2_512__*__p30
reludiff__mnist_relu_2_512__*__p40
reludiff__mnist_relu_2_512__*__p50
reludiff__mnist_relu_4_1024__*__p5
reludiff__mnist_relu_4_1024__*__p10
reludiff__mnist_relu_4_1024__*__p20
reludiff__mnist_relu_4_1024__*__p30
reludiff__mnist_relu_4_1024__*__p40
reludiff__mnist_relu_4_1024__*__p50


# Timeout
neurodiff__mnist_relu_4_1024__global__p5
neurodiff__mnist_relu_4_1024__global__p10
neurodiff__mnist_relu_4_1024__global__p20
neurodiff__mnist_relu_4_1024__global__p30
neurodiff__mnist_relu_4_1024__global__p40
neurodiff__mnist_relu_4_1024__global__p50

neurodiff__mnist_relu_4_1024__three_pixel__p30
