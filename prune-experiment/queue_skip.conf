# Queue-level skip list for scripts/verda_worker.sh.
# Any cell whose tag (method__arch__mode__prate) matches a pattern below is
# dropped from the sweep by every worker: never claimed, never run.
# One glob pattern per line (shell case-globbing: * ? [..]); # starts a comment.
# Read live per-cell, so edits reach running workers -- but a worker only honors
# this file once it is (re)started on the script version that added the feature.
#
# Examples:
#   *__mnist_relu_4_1024__global__p50    # skip this cell for ALL methods
#   milp_abcrown__*                      # skip every MILP cell

# Too-heavy MILP cells (2_512 / 4_1024, low prune rates) -- excluded 2026-09-17.
milp_abcrown__mnist_relu_2_512__global__p5
milp_abcrown__mnist_relu_2_512__global__p10
milp_abcrown__mnist_relu_4_1024__global__p5
milp_abcrown__mnist_relu_4_1024__global__p10
